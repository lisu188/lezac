name: Analyze JSON array4 helper

on:
  push:
    branches:
      - refactor/json-array4-analysis
    paths:
      - .json-array4-analyze

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/json-array4-analysis
          fetch-depth: 0
      - name: Capture helper consumers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('src/app/app.cpp').read_text().splitlines()
          needle = 'extractU8Array4('
          hits = [(i, line.strip()) for i, line in enumerate(lines, 1) if needle in line]
          out = [f'extractU8Array4 occurrences={len(hits)}']
          out += [f'{i}: {line}' for i, line in hits]
          Path('json_array4_analysis.txt').write_text('\n'.join(out) + '\n')
          PY
          rm .json-array4-analyze .github/workflows/analyze-json-array4.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Capture JSON array4 helper consumers"
          git push origin HEAD:refactor/json-array4-analysis
