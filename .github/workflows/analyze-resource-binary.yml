name: Analyze resource binary helpers

on:
  push:
    branches:
      - refactor/resource-binary-analysis
    paths:
      - .resource-binary-analyze

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/resource-binary-analysis
          fetch-depth: 0
      - name: Capture binary helper window and consumers
        run: |
          python3 - <<'PY'
          from pathlib import Path

          lines = Path('src/app/app.cpp').read_text().splitlines()
          names = ['le16', 'getU8', 'getU16', 'getFixedRecords', 'getBytes']
          out = ['===== helper source window =====']
          for i in range(720, 805):
              out.append(f'{i}: {lines[i-1]}')
          out.append('')
          out.append('===== call sites =====')
          for name in names:
              hits = []
              needle = name + '('
              for i, line in enumerate(lines, 1):
                  if needle in line:
                      hits.append((i, line.strip()))
              out.append(f'--- {name} occurrences={len(hits)} ---')
              for i, line in hits:
                  out.append(f'{i}: {line}')
          Path('resource_binary_helper_analysis.txt').write_text('\n'.join(out) + '\n')
          PY
          rm .resource-binary-analyze .github/workflows/analyze-resource-binary.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Capture resource binary helper analysis"
          git push origin HEAD:refactor/resource-binary-analysis
