name: Analyze resource JSON helpers

on:
  push:
    branches:
      - refactor/resource-json-analysis
    paths:
      - .resource-json-analyze

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/resource-json-analysis
          fetch-depth: 0
      - name: Capture JSON helper definitions and call sites
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/app/app.cpp')
          text = path.read_text()
          lines = text.splitlines()
          names = ['extractStringArray', 'extractObjectArray', 'extractInt', 'extractString']

          def definition(name):
              marker = name + '('
              pos = text.find(marker)
              if pos < 0:
                  raise SystemExit(f'missing {name}')
              line_start = text.rfind('\n', 0, pos) + 1
              brace = text.find('{', pos)
              if brace < 0:
                  raise SystemExit(f'missing body for {name}')
              depth = 0
              in_string = False
              in_char = False
              escape = False
              i = brace
              while i < len(text):
                  ch = text[i]
                  if escape:
                      escape = False
                  elif ch == '\\' and (in_string or in_char):
                      escape = True
                  elif ch == '"' and not in_char:
                      in_string = not in_string
                  elif ch == "'" and not in_string:
                      in_char = not in_char
                  elif not in_string and not in_char:
                      if ch == '{':
                          depth += 1
                      elif ch == '}':
                          depth -= 1
                          if depth == 0:
                              end = i + 1
                              while end < len(text) and text[end] in ' \t':
                                  end += 1
                              if end < len(text) and text[end] == '\n':
                                  end += 1
                              return text[line_start:end]
                  i += 1
              raise SystemExit(f'unterminated {name}')

          out = []
          for name in names:
              hits = [(i + 1, line.strip()) for i, line in enumerate(lines) if name + '(' in line]
              out.append(f'===== {name} occurrences={len(hits)} =====')
              out.append(definition(name).rstrip())
              out.append('----- call sites -----')
              for line_no, line in hits:
                  out.append(f'{line_no}: {line}')
              out.append('')
          Path('resource_json_helper_report.txt').write_text('\n'.join(out))
          PY
          rm .resource-json-analyze .github/workflows/analyze-resource-json.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Capture resource JSON helper analysis"
          git push origin HEAD:refactor/resource-json-analysis
