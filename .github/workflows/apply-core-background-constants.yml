name: Apply core background constants

on:
  push:
    branches:
      - refactor/core-background-constants
    paths:
      - .core-background-constants-apply

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/core-background-constants
          fetch-depth: 0
      - name: Apply background constant ownership move
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('src/app/app.cpp')
          text = app.read_text()

          anchor = 'using lezac::core::kTileSize;\n'
          replacement = 'using lezac::core::kBackgroundH;\nusing lezac::core::kBackgroundW;\n' + anchor
          if text.count(anchor) != 1:
              raise SystemExit('core constant using anchor changed')
          text = text.replace(anchor, replacement, 1)

          constants = 'constexpr int kBackgroundW = 320;\nconstexpr int kBackgroundH = 200;\n'
          if text.count(constants) != 1:
              raise SystemExit('local background dimensions changed')
          app.write_text(text.replace(constants, '', 1))

          cmake = Path('CMakeLists.txt')
          ctext = cmake.read_text()
          old = '^core_primitives=ok constants=1 progress=1 fixed=1 random=1'
          new = '^core_primitives=ok constants=3 progress=1 fixed=1 random=1'
          if ctext.count(old) != 1:
              raise SystemExit('core test regex changed')
          cmake.write_text(ctext.replace(old, new, 1))
          PY
          rm .core-background-constants-apply .github/workflows/apply-core-background-constants.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Move background dimensions into core"
          git push origin HEAD:refactor/core-background-constants
