name: Apply core primitive consumers

on:
  push:
    branches:
      - refactor/use-core-primitives

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Route production wrappers through core primitives'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/use-core-primitives
          fetch-depth: 0
      - name: Apply consumer migration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path("src/app/app.cpp")
          text = app.read_text()

          include_anchor = '#include "core/progress.hpp"\n'
          include_replacement = '''#include "core/fixed_point.hpp"\n#include "core/progress.hpp"\n#include "core/random.hpp"\n'''
          if text.count(include_anchor) != 1:
              raise SystemExit("core include anchor changed")
          text = text.replace(include_anchor, include_replacement, 1)

          fixed_block = '''void integrateAxis8_8(int& pos, uint8_t& frac, int16_t velocity) {\n    uint16_t bits = static_cast<uint16_t>(velocity);\n    uint16_t sum = static_cast<uint16_t>(frac) + (bits & 0x00ffu);\n    frac = static_cast<uint8_t>(sum & 0x00ffu);\n    int delta = static_cast<int>(static_cast<int8_t>((bits >> 8) & 0x00ffu));\n    if (sum > 0x00ffu) {\n        ++delta;\n    }\n    pos += delta;\n}\n'''
          fixed_replacement = '''void integrateAxis8_8(int& pos, uint8_t& frac, int16_t velocity) {\n    lezac::core::Fixed8_8Axis axis{pos, frac};\n    lezac::core::integrateFixed8_8(axis, velocity);\n    pos = axis.position;\n    frac = axis.fraction;\n}\n'''
          if text.count(fixed_block) != 1:
              raise SystemExit("fixed-point wrapper changed")
          text = text.replace(fixed_block, fixed_replacement, 1)

          method_start = text.find("    uint16_t randomRangeValue(uint16_t base, uint16_t range) {")
          if method_start < 0:
              raise SystemExit("randomRangeValue method missing")
          method_end = text.find("\n    }\n", method_start)
          if method_end < 0:
              raise SystemExit("randomRangeValue method end missing")
          method_end += len("\n    }\n")
          random_replacement = '''    uint16_t randomRangeValue(uint16_t base, uint16_t range) {\n        lezac::core::TurboRandom random(randomSeed_);\n        const uint16_t value = random.range(base, range);\n        randomSeed_ = random.seed();\n        return value;\n    }\n'''
          text = text[:method_start] + random_replacement + text[method_end:]
          app.write_text(text)
          PY
          rm .github/workflows/apply-core-consumers.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Route production wrappers through core primitives"
          git push origin HEAD:refactor/use-core-primitives
