name: Apply core primitives refactor

on:
  push:
    branches:
      - refactor/core-primitives-main

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Extract independently compiled core primitives'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/core-primitives-main
          fetch-depth: 0
      - name: Apply extraction
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path("src/app/app.cpp")
          app_text = app.read_text()
          include_anchor = '#include <vector>\n\nnamespace {\n'
          include_replacement = '''#include <vector>\n\n#include "core/progress.hpp"\n\nnamespace {\n\nusing lezac::core::countPhysicalDamageProgressCells;\nusing lezac::core::countsForDestructionProgress;\nusing lezac::core::countsForPhysicalDamageProgress;\n'''
          if app_text.count(include_anchor) != 1:
              raise SystemExit("app include anchor changed")
          app_text = app_text.replace(include_anchor, include_replacement, 1)

          helper_block = '''bool countsForDestructionProgress(uint8_t tile, uint8_t objectiveTile) {\n    return tile > 1 && tile != 0xff && tile != objectiveTile;\n}\n\nbool countsForPhysicalDamageProgress(uint16_t word) {\n    return word != 0 && (word & kDamagedWordBit) == 0 && word < kDeferredThreshold;\n}\n\nint countPhysicalDamageProgressCells(const std::vector<uint16_t>& words) {\n    return static_cast<int>(std::count_if(words.begin(), words.end(),\n                                          countsForPhysicalDamageProgress));\n}\n\n'''
          if app_text.count(helper_block) != 1:
              raise SystemExit("progress helper block changed")
          app.write_text(app_text.replace(helper_block, "", 1))

          Path("src/core").mkdir(parents=True, exist_ok=True)
          Path("src/core/progress.hpp").write_text('''#pragma once\n\n#include <cstdint>\n#include <vector>\n\nnamespace lezac::core {\n\nbool countsForDestructionProgress(uint8_t tile, uint8_t objectiveTile) noexcept;\nbool countsForPhysicalDamageProgress(uint16_t word) noexcept;\nint countPhysicalDamageProgressCells(const std::vector<uint16_t>& words);\n\n}\n''')
          Path("src/core/progress.cpp").write_text('''#include "core/progress.hpp"\n\n#include <algorithm>\n\nnamespace lezac::core {\nnamespace {\n\nconstexpr uint16_t kDamagedWordBit = 0x8000;\nconstexpr uint16_t kDeferredThreshold = 0x4000;\n\n}\n\nbool countsForDestructionProgress(uint8_t tile, uint8_t objectiveTile) noexcept {\n    return tile > 1 && tile != 0xff && tile != objectiveTile;\n}\n\nbool countsForPhysicalDamageProgress(uint16_t word) noexcept {\n    return word != 0 && (word & kDamagedWordBit) == 0 && word < kDeferredThreshold;\n}\n\nint countPhysicalDamageProgressCells(const std::vector<uint16_t>& words) {\n    return static_cast<int>(std::count_if(words.begin(), words.end(),\n                                          countsForPhysicalDamageProgress));\n}\n\n}\n''')
          Path("src/core/fixed_point.hpp").write_text('''#pragma once\n\n#include <cstdint>\n\nnamespace lezac::core {\n\nstruct Fixed8_8Axis {\n    int32_t position = 0;\n    uint8_t fraction = 0;\n};\n\nconstexpr int32_t floorDiv256(int32_t value) {\n    return value >= 0 ? value / 256 : -((255 - value) / 256);\n}\n\nconstexpr void integrateFixed8_8(Fixed8_8Axis& axis, int16_t velocity) {\n    const int32_t total = static_cast<int32_t>(axis.fraction) + velocity;\n    const int32_t delta = floorDiv256(total);\n    axis.position += delta;\n    axis.fraction = static_cast<uint8_t>(total - delta * 256);\n}\n\n}\n''')
          Path("src/core/random.hpp").write_text('''#pragma once\n\n#include <cstdint>\n\nnamespace lezac::core {\n\nclass TurboRandom {\npublic:\n    explicit constexpr TurboRandom(uint32_t seed = 0) : seed_(seed) {}\n\n    constexpr uint32_t seed() const {\n        return seed_;\n    }\n\n    constexpr void setSeed(uint32_t seed) {\n        seed_ = seed;\n    }\n\n    constexpr uint16_t range(uint16_t base, uint16_t range) {\n        seed_ = seed_ * 0x08088405u + 1u;\n        const uint16_t span = range == 0 ? 1 : range;\n        return static_cast<uint16_t>(base + ((seed_ >> 16) % span));\n    }\n\nprivate:\n    uint32_t seed_ = 0;\n};\n\n}\n''')

          Path("tests/core").mkdir(parents=True, exist_ok=True)
          Path("tests/core/core_primitives_test.cpp").write_text('''#include "core/fixed_point.hpp"\n#include "core/progress.hpp"\n#include "core/random.hpp"\n\n#include <array>\n#include <cstdint>\n#include <iostream>\n#include <vector>\n\nint main() {\n    using lezac::core::Fixed8_8Axis;\n    using lezac::core::TurboRandom;\n    using lezac::core::countPhysicalDamageProgressCells;\n    using lezac::core::countsForDestructionProgress;\n    using lezac::core::countsForPhysicalDamageProgress;\n    using lezac::core::integrateFixed8_8;\n\n    if (countsForDestructionProgress(0, 108) ||\n        countsForDestructionProgress(1, 108) ||\n        countsForDestructionProgress(0xff, 108) ||\n        countsForDestructionProgress(108, 108) ||\n        !countsForDestructionProgress(2, 108)) {\n        return 1;\n    }\n\n    const std::vector<uint16_t> words{0, 1, 0x3fff, 0x4000, 0x8001};\n    if (!countsForPhysicalDamageProgress(1) ||\n        !countsForPhysicalDamageProgress(0x3fff) ||\n        countsForPhysicalDamageProgress(0) ||\n        countsForPhysicalDamageProgress(0x4000) ||\n        countsForPhysicalDamageProgress(0x8001) ||\n        countPhysicalDamageProgressCells(words) != 2) {\n        return 1;\n    }\n\n    Fixed8_8Axis positive;\n    for (int i = 0; i < 4; ++i) integrateFixed8_8(positive, 64);\n\n    Fixed8_8Axis negativeOnce;\n    integrateFixed8_8(negativeOnce, -64);\n\n    Fixed8_8Axis negativeFour;\n    for (int i = 0; i < 4; ++i) integrateFixed8_8(negativeFour, -64);\n\n    Fixed8_8Axis wholePositive;\n    for (int i = 0; i < 4; ++i) integrateFixed8_8(wholePositive, 256);\n\n    Fixed8_8Axis wholeNegative;\n    for (int i = 0; i < 4; ++i) integrateFixed8_8(wholeNegative, -256);\n\n    if (positive.position != 1 || positive.fraction != 0 ||\n        negativeOnce.position != -1 || negativeOnce.fraction != 192 ||\n        negativeFour.position != -1 || negativeFour.fraction != 0 ||\n        wholePositive.position != 4 || wholePositive.fraction != 0 ||\n        wholeNegative.position != -4 || wholeNegative.fraction != 0) {\n        return 1;\n    }\n\n    TurboRandom random100(0);\n    constexpr std::array<uint16_t, 12> expected100{\n        0, 56, 29, 76, 86, 17, 85, 3, 95, 96, 74, 16,\n    };\n    for (uint16_t expected : expected100) {\n        if (random100.range(0, 100) != expected) return 1;\n    }\n\n    TurboRandom random1000(0x1234abcdu);\n    constexpr std::array<uint16_t, 8> expected1000{\n        949, 374, 129, 775, 697, 545, 722, 975,\n    };\n    for (uint16_t expected : expected1000) {\n        if (random1000.range(0, 1000) != expected) return 1;\n    }\n\n    TurboRandom zeroRange(0);\n    if (zeroRange.range(37, 0) != 37 || zeroRange.seed() != 1) return 1;\n\n    std::cout << "core_primitives=ok progress=1 fixed=1 random=1\\n";\n    return 0;\n}\n''')

          cmake = Path("CMakeLists.txt")
          cmake_text = cmake.read_text()
          executable_anchor = "add_executable(lezac_cpp src/main.cpp)"
          executable_replacement = '''add_library(lezac_core STATIC\n    src/core/progress.cpp\n)\ntarget_include_directories(lezac_core PUBLIC ${CMAKE_CURRENT_SOURCE_DIR}/src)\n\nadd_executable(lezac_cpp src/main.cpp)'''
          if cmake_text.count(executable_anchor) != 1:
              raise SystemExit("CMake executable anchor changed")
          cmake_text = cmake_text.replace(executable_anchor, executable_replacement, 1)

          link_anchor = "target_link_libraries(lezac_cpp PRIVATE ${SDL2_LIBRARIES})"
          if cmake_text.count(link_anchor) != 1:
              raise SystemExit("CMake link anchor changed")
          cmake_text = cmake_text.replace(
              link_anchor,
              "target_link_libraries(lezac_cpp PRIVATE lezac_core ${SDL2_LIBRARIES})",
              1,
          )

          test_anchor = "if(BUILD_TESTING)\n"
          test_replacement = '''if(BUILD_TESTING)\n    add_executable(lezac_core_primitives_test tests/core/core_primitives_test.cpp)\n    target_link_libraries(lezac_core_primitives_test PRIVATE lezac_core)\n    add_test(NAME core_primitives COMMAND lezac_core_primitives_test)\n    set_tests_properties(core_primitives PROPERTIES\n        PASS_REGULAR_EXPRESSION "^core_primitives=ok progress=1 fixed=1 random=1")\n\n'''
          if cmake_text.count(test_anchor) != 1:
              raise SystemExit("CMake test anchor changed")
          cmake.write_text(cmake_text.replace(test_anchor, test_replacement, 1))
          PY
          rm .github/workflows/apply-core-primitives.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Extract independently compiled core primitives"
          git push origin HEAD:refactor/core-primitives-main
