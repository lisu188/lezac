name: Apply resource binary extraction

on:
  push:
    branches:
      - refactor/resource-binary
    paths:
      - .resource-binary-apply

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/resource-binary
          fetch-depth: 0
      - name: Apply resource binary extraction
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('src/app/app.cpp')
          text = app.read_text()

          include_anchor = '#include "resources/io.hpp"\n'
          include_replacement = '#include "resources/binary.hpp"\n#include "resources/io.hpp"\n'
          if text.count(include_anchor) != 1:
              raise SystemExit('resource include anchor changed')
          text = text.replace(include_anchor, include_replacement, 1)

          using_anchor = 'using lezac::resources::vga6To8;\n'
          using_replacement = '''using lezac::resources::vga6To8;\nusing lezac::resources::getBytes;\nusing lezac::resources::getFixedRecords;\nusing lezac::resources::getU16;\nusing lezac::resources::getU8;\nusing lezac::resources::le16;\nusing lezac::resources::le32;\nusing lezac::resources::recLe16;\n'''
          if text.count(using_anchor) != 1:
              raise SystemExit('resource using anchor changed')
          text = text.replace(using_anchor, using_replacement, 1)

          blocks = [
              '''uint16_t le16(const std::vector<uint8_t>& data, size_t off) {\n    if (off + 2 > data.size()) {\n        throw std::runtime_error("unexpected EOF while reading u16");\n    }\n    return static_cast<uint16_t>(data[off] | (data[off + 1] << 8));\n}\n\n''',
              '''uint32_t le32(const std::vector<uint8_t>& data, size_t off) {\n    if (off + 4 > data.size()) {\n        throw std::runtime_error("unexpected EOF while reading u32");\n    }\n    return static_cast<uint32_t>(data[off] | (data[off + 1] << 8) |\n                                 (data[off + 2] << 16) | (data[off + 3] << 24));\n}\n\n''',
              '''template <size_t N>\nuint16_t recLe16(const std::array<uint8_t, N>& rec, size_t off) {\n    return static_cast<uint16_t>(rec[off] | (rec[off + 1] << 8));\n}\n\n''',
              '''uint8_t getU8(const std::vector<uint8_t>& data, size_t& off) {\n    if (off >= data.size()) {\n        throw std::runtime_error("unexpected EOF while reading u8");\n    }\n    return data[off++];\n}\n\n''',
              '''uint16_t getU16(const std::vector<uint8_t>& data, size_t& off) {\n    uint16_t value = le16(data, off);\n    off += 2;\n    return value;\n}\n\n''',
              '''template <size_t N>\nstd::vector<std::array<uint8_t, N>> getFixedRecords(const std::vector<uint8_t>& data, size_t& off) {\n    uint8_t count = getU8(data, off);\n    if (off + static_cast<size_t>(count) * N > data.size()) {\n        throw std::runtime_error("truncated fixed record block");\n    }\n    std::vector<std::array<uint8_t, N>> out;\n    out.reserve(count);\n    for (uint8_t i = 0; i < count; ++i) {\n        std::array<uint8_t, N> rec{};\n        std::copy_n(data.begin() + static_cast<long>(off), N, rec.begin());\n        off += N;\n        out.push_back(rec);\n    }\n    return out;\n}\n\n''',
              '''std::vector<uint8_t> getBytes(const std::vector<uint8_t>& data, size_t& off, size_t size) {\n    if (off + size > data.size()) {\n        throw std::runtime_error("truncated byte block");\n    }\n    std::vector<uint8_t> out(data.begin() + static_cast<long>(off),\n                             data.begin() + static_cast<long>(off + size));\n    off += size;\n    return out;\n}\n\n''',
          ]
          for block in blocks:
              if text.count(block) != 1:
                  raise SystemExit('binary helper definition changed: ' + block.splitlines()[0])
              text = text.replace(block, '', 1)
          app.write_text(text)

          cmake = Path('CMakeLists.txt')
          ctext = cmake.read_text()
          library_anchor = '''add_library(lezac_resources STATIC\n    src/resources/io.cpp\n    src/resources/json.cpp\n    src/resources/palette.cpp\n)\n'''
          library_replacement = '''add_library(lezac_resources STATIC\n    src/resources/binary.cpp\n    src/resources/io.cpp\n    src/resources/json.cpp\n    src/resources/palette.cpp\n)\n'''
          if ctext.count(library_anchor) != 1:
              raise SystemExit('resource library anchor changed')
          ctext = ctext.replace(library_anchor, library_replacement, 1)

          test_anchor = '''    set_tests_properties(resource_palette PROPERTIES\n        PASS_REGULAR_EXPRESSION "^resource_palette=ok raw=256 json=256 truncation=1")\n\n    find_package(Python3 COMPONENTS Interpreter QUIET)\n'''
          test_replacement = '''    set_tests_properties(resource_palette PROPERTIES\n        PASS_REGULAR_EXPRESSION "^resource_palette=ok raw=256 json=256 truncation=1")\n\n    add_executable(lezac_resource_binary_test tests/resources/resource_binary_test.cpp)\n    target_link_libraries(lezac_resource_binary_test PRIVATE lezac_resources)\n    add_test(NAME resource_binary COMMAND lezac_resource_binary_test)\n    set_tests_properties(resource_binary PROPERTIES\n        PASS_REGULAR_EXPRESSION "^resource_binary=ok le16=1 le32=1 cursor=1 records=2 bytes=2 truncation=4")\n\n    find_package(Python3 COMPONENTS Interpreter QUIET)\n'''
          if ctext.count(test_anchor) != 1:
              raise SystemExit('resource test anchor changed')
          ctext = ctext.replace(test_anchor, test_replacement, 1)
          cmake.write_text(ctext)
          PY
          rm .resource-binary-apply .github/workflows/apply-resource-binary.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Extract binary parsing helpers from app monolith"
          git push origin HEAD:refactor/resource-binary
