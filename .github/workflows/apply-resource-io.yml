name: Apply resource I/O extraction

on:
  push:
    branches:
      - refactor/resource-io
    paths:
      - .resource-io-apply

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/resource-io
          fetch-depth: 0
      - name: Apply resource I/O extraction
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('src/app/app.cpp')
          text = app.read_text()

          include_anchor = '#include "resources/types.hpp"\n'
          include_replacement = '#include "resources/io.hpp"\n#include "resources/types.hpp"\n'
          if text.count(include_anchor) != 1:
              raise SystemExit('resource include anchor changed')
          text = text.replace(include_anchor, include_replacement, 1)

          using_anchor = '''using lezac::resources::IndexedImage;\nusing lezac::resources::Palette;\nusing lezac::resources::Rgb;\nusing lezac::resources::Sprite;\nusing lezac::resources::SpriteBank;\n'''
          using_replacement = '''using lezac::resources::IndexedImage;\nusing lezac::resources::Palette;\nusing lezac::resources::Rgb;\nusing lezac::resources::Sprite;\nusing lezac::resources::SpriteBank;\nusing lezac::resources::parseHexByteList;\nusing lezac::resources::parseHexWordList;\nusing lezac::resources::readFile;\nusing lezac::resources::readTextFile;\n'''
          if text.count(using_anchor) != 1:
              raise SystemExit('resource using anchor changed')
          text = text.replace(using_anchor, using_replacement, 1)

          blocks = [
              '''std::vector<uint8_t> readFile(const std::string& path) {\n    std::ifstream in(path, std::ios::binary);\n    if (!in && path.find('/') == std::string::npos &&\n        path.find('\\\\') == std::string::npos) {\n        in.clear();\n        in.open("src/" + path, std::ios::binary);\n    }\n    if (!in) {\n        throw std::runtime_error("cannot open " + path);\n    }\n    return std::vector<uint8_t>(std::istreambuf_iterator<char>(in),\n                                std::istreambuf_iterator<char>());\n}\n\n''',
              '''std::string readTextFile(const std::string& path) {\n    std::ifstream in(path);\n    if (!in && path.find('/') == std::string::npos &&\n        path.find('\\\\') == std::string::npos) {\n        in.clear();\n        in.open("src/" + path);\n    }\n    if (!in) {\n        throw std::runtime_error("cannot open " + path);\n    }\n    return std::string(std::istreambuf_iterator<char>(in),\n                       std::istreambuf_iterator<char>());\n}\n\n''',
              '''std::vector<uint8_t> parseHexByteList(const std::string& hexList) {\n    std::vector<uint8_t> out;\n    std::istringstream iss(hexList);\n    std::string token;\n    while (iss >> token) {\n        int value = std::stoi(token, nullptr, 16);\n        out.push_back(static_cast<uint8_t>(value));\n    }\n    return out;\n}\n\n''',
              '''std::vector<uint16_t> parseHexWordList(const std::string& hexList) {\n    std::vector<uint16_t> out;\n    std::istringstream iss(hexList);\n    std::string token;\n    while (iss >> token) {\n        int value = std::stoi(token, nullptr, 16);\n        out.push_back(static_cast<uint16_t>(value));\n    }\n    return out;\n}\n\n''',
          ]
          for block in blocks:
              if text.count(block) != 1:
                  raise SystemExit('resource helper definition changed: ' + block.splitlines()[0])
              text = text.replace(block, '', 1)
          app.write_text(text)

          cmake = Path('CMakeLists.txt')
          ctext = cmake.read_text()
          library_anchor = '''add_library(lezac_core STATIC\n    src/core/progress.cpp\n)\ntarget_include_directories(lezac_core PUBLIC ${CMAKE_CURRENT_SOURCE_DIR}/src)\n\nadd_executable(lezac_cpp src/main.cpp)\n'''
          library_replacement = '''add_library(lezac_core STATIC\n    src/core/progress.cpp\n)\ntarget_include_directories(lezac_core PUBLIC ${CMAKE_CURRENT_SOURCE_DIR}/src)\n\nadd_library(lezac_resources STATIC\n    src/resources/io.cpp\n)\ntarget_include_directories(lezac_resources PUBLIC ${CMAKE_CURRENT_SOURCE_DIR}/src)\n\nadd_executable(lezac_cpp src/main.cpp)\n'''
          if ctext.count(library_anchor) != 1:
              raise SystemExit('CMake library anchor changed')
          ctext = ctext.replace(library_anchor, library_replacement, 1)

          link_anchor = 'target_link_libraries(lezac_cpp PRIVATE lezac_core ${SDL2_LIBRARIES})\n'
          link_replacement = 'target_link_libraries(lezac_cpp PRIVATE lezac_core lezac_resources ${SDL2_LIBRARIES})\n'
          if ctext.count(link_anchor) != 1:
              raise SystemExit('CMake app link anchor changed')
          ctext = ctext.replace(link_anchor, link_replacement, 1)

          test_anchor = '''    set_tests_properties(core_primitives PROPERTIES\n        PASS_REGULAR_EXPRESSION "^core_primitives=ok progress=1 fixed=1 random=1")\n\n    find_package(Python3 COMPONENTS Interpreter QUIET)\n'''
          test_replacement = '''    set_tests_properties(core_primitives PROPERTIES\n        PASS_REGULAR_EXPRESSION "^core_primitives=ok progress=1 fixed=1 random=1")\n\n    add_executable(lezac_resource_io_test tests/resources/resource_io_test.cpp)\n    target_link_libraries(lezac_resource_io_test PRIVATE lezac_resources)\n    add_test(NAME resource_io COMMAND lezac_resource_io_test)\n    set_tests_properties(resource_io PROPERTIES\n        PASS_REGULAR_EXPRESSION "^resource_io=ok bytes=4 words=4 binary=5 text=5")\n\n    find_package(Python3 COMPONENTS Interpreter QUIET)\n'''
          if ctext.count(test_anchor) != 1:
              raise SystemExit('CMake test anchor changed')
          ctext = ctext.replace(test_anchor, test_replacement, 1)
          cmake.write_text(ctext)
          PY
          rm .resource-io-apply .github/workflows/apply-resource-io.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Extract resource I/O helpers from app monolith"
          git push origin HEAD:refactor/resource-io
