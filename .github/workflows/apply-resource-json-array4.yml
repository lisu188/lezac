name: Apply JSON array4 extraction

on:
  push:
    branches:
      - refactor/resource-json-array4
    paths:
      - .resource-json-array4-apply

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/resource-json-array4
          fetch-depth: 0
      - name: Apply JSON array4 extraction
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('src/app/app.cpp')
          text = app.read_text()
          using_anchor = 'using lezac::resources::extractStringArray;\n'
          using_replacement = 'using lezac::resources::extractStringArray;\nusing lezac::resources::extractU8Array4;\n'
          if text.count(using_anchor) != 1:
              raise SystemExit('JSON using anchor changed')
          text = text.replace(using_anchor, using_replacement, 1)

          block = '''std::array<uint8_t, 4> extractU8Array4(const std::string& json, const std::string& key) {\n    std::array<uint8_t, 4> out{};\n    std::regex re("\\\"" + key + "\\\"\\\\s*:\\\\s*\\\\[([^\\\\]]*)\\\\]");\n    std::smatch m;\n    if (!std::regex_search(json, m, re)) return out;\n    std::regex intRe("(\\\\d+)");\n    int i = 0;\n    std::string body = m[1].str();\n    for (auto it = std::sregex_iterator(body.begin(), body.end(), intRe);\n         it != std::sregex_iterator() && i < 4; ++it, ++i) {\n        out[static_cast<size_t>(i)] = static_cast<uint8_t>(std::stoi((*it)[1].str()));\n    }\n    return out;\n}\n\n'''
          if text.count(block) != 1:
              raise SystemExit('extractU8Array4 definition changed')
          app.write_text(text.replace(block, '', 1))
          PY
          rm .resource-json-array4-apply .github/workflows/apply-resource-json-array4.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Move fixed JSON byte arrays into resources"
          git push origin HEAD:refactor/resource-json-array4
