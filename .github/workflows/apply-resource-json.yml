name: Apply resource JSON extraction

on:
  push:
    branches:
      - refactor/resource-json
    paths:
      - .resource-json-apply

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/resource-json
          fetch-depth: 0
      - name: Apply resource JSON extraction
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('src/app/app.cpp')
          text = app.read_text()

          include_anchor = '#include "resources/io.hpp"\n#include "resources/types.hpp"\n'
          include_replacement = '#include "resources/io.hpp"\n#include "resources/json.hpp"\n#include "resources/types.hpp"\n'
          if text.count(include_anchor) != 1:
              raise SystemExit('resource include anchor changed')
          text = text.replace(include_anchor, include_replacement, 1)

          using_anchor = 'using lezac::resources::readTextFile;\n'
          using_replacement = '''using lezac::resources::readTextFile;\nusing lezac::resources::extractInt;\nusing lezac::resources::extractObjectArray;\nusing lezac::resources::extractString;\nusing lezac::resources::extractStringArray;\n'''
          if text.count(using_anchor) != 1:
              raise SystemExit('resource using anchor changed')
          text = text.replace(using_anchor, using_replacement, 1)

          blocks = [
              '''std::vector<std::string> extractStringArray(const std::string& json, const std::string& key) {\n    std::vector<std::string> rows;\n    std::string needle = "\\\"" + key + "\\\"";\n    size_t keyPos = json.find(needle);\n    if (keyPos == std::string::npos) return rows;\n    size_t open = json.find('[', keyPos);\n    if (open == std::string::npos) return rows;\n    size_t depth = 1;\n    for (size_t i = open + 1; i < json.size() && depth > 0; ++i) {\n        char ch = json[i];\n        if (ch == '[') {\n            ++depth;\n        } else if (ch == ']') {\n            --depth;\n        } else if (ch == '\"') {\n            size_t end = json.find('\"', i + 1);\n            if (end == std::string::npos) break;\n            rows.push_back(json.substr(i + 1, end - i - 1));\n            i = end;\n        }\n    }\n    return rows;\n}\n\n''',
              '''std::vector<std::string> extractObjectArray(const std::string& json, const std::string& key) {\n    std::vector<std::string> objects;\n    std::string needle = "\\\"" + key + "\\\"";\n    size_t keyPos = json.find(needle);\n    if (keyPos == std::string::npos) return objects;\n    size_t open = json.find('[', keyPos);\n    if (open == std::string::npos) return objects;\n    size_t depth = 1;\n    for (size_t i = open + 1; i < json.size() && depth > 0; ++i) {\n        if (json[i] == '[') {\n            ++depth;\n        } else if (json[i] == ']') {\n            --depth;\n        } else if (depth == 1 && json[i] == '{') {\n            size_t objStart = i;\n            size_t objDepth = 1;\n            for (++i; i < json.size() && objDepth > 0; ++i) {\n                if (json[i] == '{') ++objDepth;\n                else if (json[i] == '}') --objDepth;\n            }\n            if (objDepth == 0) {\n                objects.push_back(json.substr(objStart, i - objStart));\n            }\n            --i;\n        }\n    }\n    return objects;\n}\n\n''',
              '''int extractInt(const std::string& json, const std::string& key, int fallback = 0) {\n    std::regex re("\\\"" + key + "\\\"\\\\s*:\\\\s*(-?\\\\d+)");\n    std::smatch m;\n    if (std::regex_search(json, m, re)) {\n        return std::stoi(m[1].str());\n    }\n    return fallback;\n}\n\n''',
              '''std::string extractString(const std::string& json, const std::string& key,\n                          const std::string& fallback = "") {\n    std::regex re("\\\"" + key + "\\\"\\\\s*:\\\\s*\\\"([^\\\"]*)\\\"");\n    std::smatch m;\n    if (std::regex_search(json, m, re)) {\n        return m[1].str();\n    }\n    return fallback;\n}\n\n''',
          ]
          for block in blocks:
              if text.count(block) != 1:
                  raise SystemExit('JSON helper definition changed: ' + block.splitlines()[0])
              text = text.replace(block, '', 1)
          app.write_text(text)

          cmake = Path('CMakeLists.txt')
          ctext = cmake.read_text()
          library_anchor = '''add_library(lezac_resources STATIC\n    src/resources/io.cpp\n)\n'''
          library_replacement = '''add_library(lezac_resources STATIC\n    src/resources/io.cpp\n    src/resources/json.cpp\n)\n'''
          if ctext.count(library_anchor) != 1:
              raise SystemExit('resource library anchor changed')
          ctext = ctext.replace(library_anchor, library_replacement, 1)

          test_anchor = '''    set_tests_properties(resource_io PROPERTIES\n        PASS_REGULAR_EXPRESSION "^resource_io=ok bytes=4 words=4 binary=5 text=5")\n\n    find_package(Python3 COMPONENTS Interpreter QUIET)\n'''
          test_replacement = '''    set_tests_properties(resource_io PROPERTIES\n        PASS_REGULAR_EXPRESSION "^resource_io=ok bytes=4 words=4 binary=5 text=5")\n\n    add_executable(lezac_resource_json_test tests/resources/resource_json_test.cpp)\n    target_link_libraries(lezac_resource_json_test PRIVATE lezac_resources)\n    add_test(NAME resource_json COMMAND lezac_resource_json_test)\n    set_tests_properties(resource_json PROPERTIES\n        PASS_REGULAR_EXPRESSION "^resource_json=ok rows=2 objects=2 int=-42 string=lezac fallbacks=2")\n\n    find_package(Python3 COMPONENTS Interpreter QUIET)\n'''
          if ctext.count(test_anchor) != 1:
              raise SystemExit('resource test anchor changed')
          ctext = ctext.replace(test_anchor, test_replacement, 1)
          cmake.write_text(ctext)
          PY
          rm .resource-json-apply .github/workflows/apply-resource-json.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Extract resource JSON helpers from app monolith"
          git push origin HEAD:refactor/resource-json
