name: Apply sprite loader extraction

on:
  push:
    branches:
      - refactor/resource-sprites
    paths:
      - .resource-sprites-apply

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/resource-sprites
          fetch-depth: 0
      - name: Apply sprite loader extraction
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('src/app/app.cpp')
          text = app.read_text()

          include_anchor = '#include "resources/palette.hpp"\n#include "resources/types.hpp"\n'
          include_replacement = '#include "resources/palette.hpp"\n#include "resources/sprites.hpp"\n#include "resources/types.hpp"\n'
          if text.count(include_anchor) != 1:
              raise SystemExit('resource include anchor changed')
          text = text.replace(include_anchor, include_replacement, 1)

          using_anchor = 'using lezac::resources::loadPaletteFile;\n'
          using_replacement = '''using lezac::resources::loadPaletteFile;\nusing lezac::resources::loadRawSprites;\nusing lezac::resources::loadSprites;\n'''
          if text.count(using_anchor) != 1:
              raise SystemExit('resource using anchor changed')
          text = text.replace(using_anchor, using_replacement, 1)

          blocks = [
              '''SpriteBank loadSprites(const std::string& path) {\n    auto json = readTextFile(path);\n    SpriteBank bank;\n    auto spriteObjects = extractObjectArray(json, "sprites");\n    bank.sprites.reserve(spriteObjects.size());\n    for (const auto& spriteJson : spriteObjects) {\n        Sprite s;\n        s.width = extractInt(spriteJson, "width");\n        s.height = extractInt(spriteJson, "height");\n        for (const auto& row : extractStringArray(spriteJson, "rows_hex")) {\n            auto bytes = parseHexByteList(row);\n            s.pixels.insert(s.pixels.end(), bytes.begin(), bytes.end());\n        }\n        if (s.pixels.size() != static_cast<size_t>(s.width) * s.height) {\n            throw std::runtime_error(path + " sprite size mismatch");\n        }\n        bank.sprites.push_back(std::move(s));\n    }\n    return bank;\n}\n\n''',
              '''SpriteBank loadRawSprites(const std::string& path) {\n    auto data = readFile(path);\n    if (data.empty()) {\n        throw std::runtime_error(path + " is empty");\n    }\n    SpriteBank bank;\n    size_t offset = 0;\n    uint8_t count = data[offset++];\n    bank.sprites.reserve(count);\n    for (uint8_t i = 0; i < count; ++i) {\n        if (offset + 2 > data.size()) {\n            throw std::runtime_error(path + " truncated sprite header");\n        }\n        Sprite sprite;\n        sprite.width = data[offset++];\n        sprite.height = data[offset++];\n        size_t pixelCount = static_cast<size_t>(sprite.width) * sprite.height;\n        if (offset + pixelCount > data.size()) {\n            throw std::runtime_error(path + " truncated sprite pixels");\n        }\n        sprite.pixels.insert(sprite.pixels.end(),\n                             data.begin() + static_cast<std::ptrdiff_t>(offset),\n                             data.begin() +\n                                 static_cast<std::ptrdiff_t>(offset + pixelCount));\n        offset += pixelCount;\n        bank.sprites.push_back(std::move(sprite));\n    }\n    if (offset != data.size()) {\n        throw std::runtime_error(path + " trailing sprite bytes");\n    }\n    return bank;\n}\n\n''',
          ]
          for block in blocks:
              if text.count(block) != 1:
                  raise SystemExit('sprite loader definition changed: ' + block.splitlines()[0])
              text = text.replace(block, '', 1)
          app.write_text(text)

          cmake = Path('CMakeLists.txt')
          ctext = cmake.read_text()
          library_anchor = '''add_library(lezac_resources STATIC\n    src/resources/binary.cpp\n    src/resources/io.cpp\n    src/resources/json.cpp\n    src/resources/palette.cpp\n)\n'''
          library_replacement = '''add_library(lezac_resources STATIC\n    src/resources/binary.cpp\n    src/resources/io.cpp\n    src/resources/json.cpp\n    src/resources/palette.cpp\n    src/resources/sprites.cpp\n)\n'''
          if ctext.count(library_anchor) != 1:
              raise SystemExit('resource library anchor changed')
          ctext = ctext.replace(library_anchor, library_replacement, 1)

          test_anchor = '''    set_tests_properties(resource_binary PROPERTIES\n        PASS_REGULAR_EXPRESSION "^resource_binary=ok le16=1 le32=1 cursor=1 records=2 bytes=2 truncation=5")\n\n    find_package(Python3 COMPONENTS Interpreter QUIET)\n'''
          test_replacement = '''    set_tests_properties(resource_binary PROPERTIES\n        PASS_REGULAR_EXPRESSION "^resource_binary=ok le16=1 le32=1 cursor=1 records=2 bytes=2 truncation=5")\n\n    add_executable(lezac_resource_sprites_test tests/resources/resource_sprites_test.cpp)\n    target_link_libraries(lezac_resource_sprites_test PRIVATE lezac_resources)\n    add_test(NAME resource_sprites COMMAND lezac_resource_sprites_test)\n    set_tests_properties(resource_sprites PROPERTIES\n        PASS_REGULAR_EXPRESSION "^resource_sprites=ok json=2 raw=2 guards=5")\n\n    find_package(Python3 COMPONENTS Interpreter QUIET)\n'''
          if ctext.count(test_anchor) != 1:
              raise SystemExit('resource test anchor changed')
          ctext = ctext.replace(test_anchor, test_replacement, 1)
          cmake.write_text(ctext)
          PY
          rm .resource-sprites-apply .github/workflows/apply-resource-sprites.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Extract sprite loaders from app monolith"
          git push origin HEAD:refactor/resource-sprites
