name: Apply tile loader extraction

on:
  push:
    branches:
      - refactor/resource-tiles
    paths:
      - .resource-tiles-apply

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/resource-tiles
          fetch-depth: 0
      - name: Apply tile loader extraction
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('src/app/app.cpp')
          text = app.read_text()

          include_anchor = '#include "resources/sprites.hpp"\n#include "resources/types.hpp"\n'
          include_replacement = '#include "resources/sprites.hpp"\n#include "resources/tiles.hpp"\n#include "resources/types.hpp"\n'
          if text.count(include_anchor) != 1:
              raise SystemExit('resource include anchor changed')
          text = text.replace(include_anchor, include_replacement, 1)

          model_anchor = 'using lezac::resources::SpriteBank;\n'
          model_replacement = model_anchor + 'using lezac::resources::TileBank;\n'
          if text.count(model_anchor) != 1:
              raise SystemExit('resource model using anchor changed')
          text = text.replace(model_anchor, model_replacement, 1)

          loader_anchor = 'using lezac::resources::loadSprites;\n'
          loader_replacement = loader_anchor + 'using lezac::resources::loadRawTiles;\nusing lezac::resources::loadTiles;\n'
          if text.count(loader_anchor) != 1:
              raise SystemExit('resource loader using anchor changed')
          text = text.replace(loader_anchor, loader_replacement, 1)

          blocks = [
              '''struct TileBank {\n    int count = 0;\n    std::vector<uint8_t> pixels;\n\n    const uint8_t* tile(int id) const {\n        if (id < 0 || id >= count) {\n            return nullptr;\n        }\n        return pixels.data() + static_cast<size_t>(id) * kTileSize * kTileSize;\n    }\n};\n\n''',
              '''TileBank loadTiles(const std::string& path) {\n    auto json = readTextFile(path);\n    TileBank bank;\n    bank.count = extractInt(json, "tile_count");\n    auto tileObjects = extractObjectArray(json, "tiles");\n    if (static_cast<int>(tileObjects.size()) != bank.count) {\n        throw std::runtime_error(path + " tile count mismatch");\n    }\n    for (const auto& tileJson : tileObjects) {\n        for (const auto& row : extractStringArray(tileJson, "rows_hex")) {\n            auto bytes = parseHexByteList(row);\n            bank.pixels.insert(bank.pixels.end(), bytes.begin(), bytes.end());\n        }\n    }\n    return bank;\n}\n\n''',
              '''TileBank loadRawTiles(const std::string& path) {\n    auto data = readFile(path);\n    if (data.size() < 2) {\n        throw std::runtime_error(path + " is too small for a tile header");\n    }\n    TileBank bank;\n    bank.count = static_cast<int>((data[0] << 8) | data[1]);\n    size_t payloadSize = data.size() - 2;\n    size_t expectedSize = static_cast<size_t>(bank.count) * kTileSize * kTileSize;\n    if (bank.count <= 0 || payloadSize != expectedSize) {\n        throw std::runtime_error(path + " raw tile payload size mismatch");\n    }\n    bank.pixels.insert(bank.pixels.end(), data.begin() + 2, data.end());\n    return bank;\n}\n\n''',
          ]
          for block in blocks:
              if text.count(block) != 1:
                  raise SystemExit('tile extraction anchor changed: ' + block.splitlines()[0])
              text = text.replace(block, '', 1)
          app.write_text(text)

          cmake = Path('CMakeLists.txt')
          ctext = cmake.read_text()
          library_anchor = '''add_library(lezac_resources STATIC\n    src/resources/binary.cpp\n    src/resources/io.cpp\n    src/resources/json.cpp\n    src/resources/palette.cpp\n    src/resources/sprites.cpp\n)\n'''
          library_replacement = '''add_library(lezac_resources STATIC\n    src/resources/binary.cpp\n    src/resources/io.cpp\n    src/resources/json.cpp\n    src/resources/palette.cpp\n    src/resources/sprites.cpp\n    src/resources/tiles.cpp\n)\n'''
          if ctext.count(library_anchor) != 1:
              raise SystemExit('resource library anchor changed')
          ctext = ctext.replace(library_anchor, library_replacement, 1)

          test_anchor = '''    set_tests_properties(resource_sprites PROPERTIES\n        PASS_REGULAR_EXPRESSION "^resource_sprites=ok json=2 raw=2 guards=5")\n\n    find_package(Python3 COMPONENTS Interpreter QUIET)\n'''
          test_replacement = '''    set_tests_properties(resource_sprites PROPERTIES\n        PASS_REGULAR_EXPRESSION "^resource_sprites=ok json=2 raw=2 guards=5")\n\n    add_executable(lezac_resource_tiles_test tests/resources/resource_tiles_test.cpp)\n    target_link_libraries(lezac_resource_tiles_test PRIVATE lezac_resources)\n    add_test(NAME resource_tiles COMMAND lezac_resource_tiles_test)\n    set_tests_properties(resource_tiles PROPERTIES\n        PASS_REGULAR_EXPRESSION "^resource_tiles=ok json=2 raw=2 tile_lookup=1 guards=4")\n\n    find_package(Python3 COMPONENTS Interpreter QUIET)\n'''
          if ctext.count(test_anchor) != 1:
              raise SystemExit('resource test anchor changed')
          ctext = ctext.replace(test_anchor, test_replacement, 1)
          cmake.write_text(ctext)
          PY
          rm .resource-tiles-apply .github/workflows/apply-resource-tiles.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Extract tile model and loaders from app monolith"
          git push origin HEAD:refactor/resource-tiles
