name: Original behavior-4 target probe

on:
  pull_request:
    paths:
      - tools/capture_original_behavior4_targets.py
      - .github/workflows/behavior4-target-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original:
    name: Original active and inactive target decisions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SDL_AUDIODRIVER: dummy
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - uses: actions/checkout@v4
      - name: Install original capture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pil xvfb xdotool dosbox
      - name: Check pinned instruction windows
        run: python3 -B tools/capture_original_behavior4_targets.py --self-check
      - name: Stage private original assets
        run: |
          python3 -B - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import shutil
          import sys
          sys.path.insert(0, 'tools')
          import capture_original_behavior4_lockstep as environment
          memory = {key: int(value.split()[0]) * 1024
                    for line in Path('/proc/meminfo').read_text().splitlines()
                    for key, value in [line.split(':', 1)]}
          usage = shutil.disk_usage(os.environ['RUNNER_TEMP'])
          assert usage.free - 128 * 1024 * 1024 > usage.total // 10
          assert memory['MemAvailable'] - 512 * 1024 * 1024 > memory['MemTotal'] // 10
          run = Path(os.environ['RUNNER_TEMP']) / 'behavior4-target-original'
          run.mkdir()
          for name in environment.REQUIRED_ASSETS:
              source = Path(name)
              target = run / name
              shutil.copyfile(source, target)
              assert hashlib.sha256(source.read_bytes()).digest() == hashlib.sha256(target.read_bytes()).digest()
          PY
      - name: Observe original target branches
        run: |
          python3 -B tools/capture_original_behavior4_targets.py \
            --run-dir "$RUNNER_TEMP/behavior4-target-original" \
            --out-dir "$RUNNER_TEMP/behavior4-target-capture" \
            --approve-procmem --approve-runtime-instrumentation
      - name: Preserve original probe and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: behavior4-target-original
          path: |
            ${{ runner.temp }}/behavior4-target-capture/
            ${{ runner.temp }}/behavior4-target-original/
          if-no-files-found: error
