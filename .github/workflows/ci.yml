          name: physics-dispatch-linux
          path: build/physics-dispatch-app/
          if-no-files-found: ignore
      - name: Flame contact word regressions
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: ctest --test-dir build --output-on-failure -R '^flame_contact_word(_contract)?$'
      - name: Original sound interrupt regressions
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: ctest --test-dir build --output-on-failure --timeout 30 -R '^sound_interrupt(_original)?$'
      - name: Clocked sound regressions
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: ctest --test-dir build --output-on-failure --timeout 30 -R '^clocked_sound'
      - name: Preserve clocked sound frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clocked-sound-linux
          path: |
            build/clocked-sound-checks/
            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: ignore
      - name: Pickup post-allocation initialization regressions
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: ctest --test-dir build --output-on-failure -R '^(pickup_post_init_(original|contract|checker_failures)|transient_actor_limits)$'
