            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: error
      - name: Complete debris updater regressions
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: ctest --test-dir build --output-on-failure -R '^original_debris_update(_contract)?$'
      - name: Preserve complete debris updater diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debris-updater-linux
          path: build/debris-update-failures/
          if-no-files-found: ignore
      - name: Complete collapse updater regressions
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: ctest --test-dir build --output-on-failure -R '^original_collapse_update(_contract)?$'
      - name: Collapse actor creation regressions
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: ctest --test-dir build --output-on-failure -R '^original_collapse_actors(_contract|_checker)?$'
      - name: Preserve collapse actor diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collapse-actors-linux
          path: build/collapse-actor-failures/
          if-no-files-found: ignore
      - name: Preserve complete collapse updater diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collapse-updater-linux
          path: build/collapse-update-failures/
          if-no-files-found: ignore
      - name: Collapse seed geometry regressions
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: ctest --test-dir build --output-on-failure -R '^collapse_seed_geometry_(original|contract)$'
      - name: Actor constructor velocity regressions
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: ctest --test-dir build --output-on-failure -R '^(actor_constructor_velocity_(original|contract|checker_failures)|bomb_launch_word)$'
      - name: Preserve actor constructor diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actor-constructor-velocity-linux
          path: |
            build/actor-constructor-velocity-checks/
            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: ignore
      - name: Collapse contact regressions
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: ctest --test-dir build --output-on-failure -R '^collapse_(contacts_(original|contract|failure_retention)|(seed|lane|support)_history_(fixture|checker|original)|(contact_)?continu(ity|ous)_(fixture|checker|original)|history_(ctest|repetition)_contract|support_transport_contract)$'
      - name: Preserve collapse contact diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collapse-contact-linux
          path: |
            build/collapse-contact-failures/
            build/collapse-seed-history-app/
            build/collapse-lane-history-app/
            build/collapse-support-history-app/
            build/collapse-continuity-app/
            build/collapse-continuous-app/
            build/collapse-history-ctest/
            build/collapse-history-repetition/
            build/collapse-support-transport/
          if-no-files-found: ignore
      - name: Preserve multi-record collapse continuity diagnostics
        if: always()
