name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux build and full test suite
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libsdl2-dev python3 python3-pil xvfb xdotool x11-xserver-utils dosbox
      - name: Historical review repair regressions
        env:
          SDL_AUDIODRIVER: dummy
        run: python3 -S -B tools/test_review_history_repairs.py -v
      - name: Raw lane-word classification regressions
        env:
          SDL_AUDIODRIVER: dummy
        run: python3 -B tools/check_lane_word_classification.py
      - name: Contact checker failure-retention regressions
        env:
          SDL_AUDIODRIVER: dummy
        run: python3 -B tools/check_collapse_contact_failure_retention.py
      - name: PPM raster boundary regressions
        env:
          SDL_AUDIODRIVER: dummy
        run: python3 -B tools/check_frame_compare_ppm.py
      - name: Source ownership and guardrail regressions
        env:
          SDL_AUDIODRIVER: dummy
        run: python3 -B tools/check_source_guardrails.py
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Transient animation backup regressions
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: ctest --test-dir build --verbose --output-on-failure -R '^transient_animation_backup_original$'
      - name: Preserve transient animation backup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transient-animation-backup-linux
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
      - name: Complete debris updater regressions
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: ctest --test-dir build --output-on-failure -R '^original_debris_update(_contract)?$'
      - name: Preserve complete debris updater diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debris-updater-linux
          path: build/debris-update-failures/
          if-no-files-found: ignore
      - name: Complete collapse updater regressions
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: ctest --test-dir build --output-on-failure -R '^original_collapse_update(_contract)?$'
      - name: Collapse actor creation regressions
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: ctest --test-dir build --output-on-failure -R '^original_collapse_actors(_contract|_checker)?$'
      - name: Preserve collapse actor diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collapse-actors-linux
          path: build/collapse-actor-failures/
          if-no-files-found: ignore
      - name: Preserve complete collapse updater diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collapse-updater-linux
          path: build/collapse-update-failures/
          if-no-files-found: ignore
      - name: Collapse seed geometry regressions
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: ctest --test-dir build --output-on-failure -R '^collapse_seed_geometry_(original|contract)$'
      - name: Actor constructor velocity regressions
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: ctest --test-dir build --output-on-failure -R '^(actor_constructor_velocity_(original|contract|checker_failures)|bomb_launch_word)$'
      - name: Preserve actor constructor diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actor-constructor-velocity-linux
          path: |
            build/actor-constructor-velocity-checks/
            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: ignore
      - name: Collapse contact regressions
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: ctest --test-dir build --output-on-failure -R '^collapse_contacts_(original|contract|failure_retention)$'
      - name: Preserve collapse contact diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collapse-contact-linux
          path: build/collapse-contact-failures/
          if-no-files-found: ignore
      - name: Flame contact word regressions
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: ctest --test-dir build --output-on-failure -R '^flame_contact_word(_contract)?$'
      - name: Original sound interrupt regressions
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: ctest --test-dir build --output-on-failure --timeout 30 -R '^sound_interrupt(_original)?$'
      - name: Clocked sound regressions
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: ctest --test-dir build --output-on-failure --timeout 30 -R '^clocked_sound'
      - name: Preserve clocked sound frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clocked-sound-linux
          path: |
            build/clocked-sound-checks/
            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: ignore
      - name: Pickup post-allocation initialization regressions
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: ctest --test-dir build --output-on-failure -R '^(pickup_post_init_(original|contract|checker_failures)|transient_actor_limits)$'
      - name: Preserve focused pickup initialization comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pickup-post-init-linux-focused
          path: build/pickup-post-init-checks/
          if-no-files-found: ignore
      - name: Test
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: ctest --test-dir build --output-on-failure --timeout 120
      - name: Preserve final sound diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clocked-sound-linux-final
          path: |
            build/clocked-sound-checks/
            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: ignore
      - name: Preserve final actor constructor diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actor-constructor-velocity-linux-final
          path: |
            build/actor-constructor-velocity-checks/
            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: ignore
      - name: Preserve final recovery diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-diagnostics-linux-final
          path: |
            build/actor-storage-checks/
            build/debris-update-failures/
            build/collapse-update-failures/
            build/collapse-contact-failures/
            build/collapse-actor-failures/
            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: ignore
      - name: Preserve final pickup initialization comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pickup-post-init-linux-final
          path: |
            build/pickup-post-init-checks/
            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: ignore
      - name: Preserve startup RNG comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-rng-linux
          path: build/startup-rng-checks/
          if-no-files-found: ignore
      - name: Preserve behavior-4 player-state frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: behavior4-player-state-frames-linux
          path: build/frame_sequence_capture_monster_behavior4_player_states/
          if-no-files-found: ignore
      - name: Preserve live menu comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-menu-live-linux
          path: build/main-menu-live-checks/
          if-no-files-found: ignore
      - name: Preserve buffered menu input comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buffered-menu-live-linux
          path: build/buffered-menu-live-checks/
          if-no-files-found: ignore
      - name: Preserve BIOS menu input comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bios-menu-input-linux
          path: build/bios-menu-input-checks/
          if-no-files-found: ignore

  windows:
    name: Windows build and full test suite
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-ninja
