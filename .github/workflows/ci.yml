  windows:
    name: Windows build and full test suite
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-python
            mingw-w64-x86_64-SDL2
      - name: Historical review repair regressions
        env:
          SDL_AUDIODRIVER: dummy
        run: python3 -S -B tools/test_review_history_repairs.py -v
      - name: Raw lane-word classification regressions
        env:
          SDL_AUDIODRIVER: dummy
        run: python -B tools/check_lane_word_classification.py
      - name: Contact checker failure-retention regressions
        env:
          SDL_AUDIODRIVER: dummy
        run: python -B tools/check_collapse_contact_failure_retention.py
      - name: PPM raster boundary regressions
        env:
          SDL_AUDIODRIVER: dummy
        run: python -B tools/check_frame_compare_ppm.py
      - name: Source ownership and guardrail regressions
        env:
          SDL_AUDIODRIVER: dummy
        run: python -B tools/check_source_guardrails.py
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Collapse map boundary regressions
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: ctest --test-dir build --verbose --output-on-failure -R '^(collapse_rectangle_unit|collapse_(map|removal|physical_seed)_(unit|fixture|checker|original))$'
      - name: Preserve collapse map boundary diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collapse-map-${{ runner.os }}
          path: |
            build/collapse-map-app/
            build/collapse-removal-app/
            build/physical-seed-app/
            build/Testing/Temporary/LastTest.log
          if-no-files-found: error
      - name: Generic corpse and boss sound ownership regressions
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: ctest --test-dir build --verbose --output-on-failure -R '^(monster_tile_damage_original|monster_death_sound)$'
      - name: Preserve focused corpse sound diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpse-sound-windows-focused
          path: |
            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: error
      - name: Physical spawner construction regressions
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: ctest --test-dir build --verbose --output-on-failure -R '^(spawner_construction_(fixture|storage_original)|spawner_storage)$'
      - name: Preserve focused spawner construction diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spawner-construction-windows-focused
          path: |
            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: error
      - name: Byte-addressed damage lane regressions
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: ctest --test-dir build --verbose --output-on-failure -R '^damage_lane_(bytes_(unit|checker|fixture|original)|memory_(unit|initial_data(_checker)?|original)|history_(checker|fixture|original))$'
      - name: Preserve byte-addressed damage lane diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: damage-lane-bytes-windows
          path: |
            build/damage-lane-bytes-app/
            build/damage-lane-memory-app/
            build/damage-lane-history-app/
          if-no-files-found: ignore
      - name: Complete fatal-entry physical storage regressions
        env:
