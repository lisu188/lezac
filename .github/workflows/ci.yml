            build/actor-identity-live-binding/
          if-no-files-found: ignore
      - name: Transient animation backup regressions
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: ctest --test-dir build --verbose --output-on-failure -R '^transient_animation_backup_original$'
      - name: Preserve transient animation backup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transient-animation-backup-linux
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
      - name: Corpse reward animation mode regressions
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: ctest --test-dir build --output-on-failure -R '^corpse_reward_animation_mode_original$'
      - name: Preserve focused corpse reward animation diagnostics
        if: always()
