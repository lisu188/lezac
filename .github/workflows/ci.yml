      - name: Preserve complete transient storage diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transient-storage-linux-focused
          path: |
            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary/LastTestsFailed.log
            build/transient-storage-checks/
          if-no-files-found: error
      - name: Production actor lifecycle regressions
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: ctest --test-dir build --verbose --output-on-failure -R '^(actor_slots_binding_contract|production_actor_lifecycle_app)$'
      - name: Preserve production actor lifecycle diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-actor-lifecycle-linux-focused
          path: |
            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: error
      - name: Monster animation and GRAN ownership regressions
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: ctest --test-dir build --output-on-failure -R '^(corpse_animation_(original_app|skip_mutant|tools_contract)|monster_animation_(original_helper|original_app|fixture_contract)|gran_usage_guardrail(_selftest)?)$'
      - name: Preserve focused monster animation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monster-animation-linux-focused
          path: |
            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary/LastTestsFailed.log
            build/corpse-animation-mutant-checks/
            build/corpse-animation-skip/app.json
          if-no-files-found: error
      - name: In-place corpse conversion regressions
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: ctest --test-dir build --output-on-failure -R '^(shared_actor_order_original|shared_actor_order_fixture_guard|corpse_conversion_identity_mutant|corpse_conversion_identity_checker_contract|corpse_conversion_identity_live_binding)$'
      - name: Preserve corpse conversion diagnostics
