name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux build and full test suite
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libsdl2-dev python3 python3-pil xvfb xdotool x11-xserver-utils dosbox
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: ctest --test-dir build --output-on-failure --timeout 120
      - name: Preserve startup RNG comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-rng-linux
          path: build/startup-rng-checks/
          if-no-files-found: ignore
      - name: Preserve behavior-4 player-state frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: behavior4-player-state-frames-linux
          path: build/frame_sequence_capture_monster_behavior4_player_states/
          if-no-files-found: ignore
      - name: Preserve live menu comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-menu-live-linux
          path: build/main-menu-live-checks/
          if-no-files-found: ignore
      - name: Preserve buffered menu input comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buffered-menu-live-linux
          path: build/buffered-menu-live-checks/
          if-no-files-found: ignore
      - name: Preserve BIOS menu input comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bios-menu-input-linux
          path: build/bios-menu-input-checks/
          if-no-files-found: ignore

  windows:
    name: Windows build and full test suite
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-python
            mingw-w64-x86_64-SDL2
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: ctest --test-dir build --output-on-failure --timeout 120
      - name: Preserve startup RNG comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-rng-windows
          path: build/startup-rng-checks/
          if-no-files-found: ignore
