name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux build and full test suite
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libsdl2-dev python3 python3-pil xvfb xdotool x11-xserver-utils dosbox
      - name: Historical review repair regressions
        env:
          SDL_AUDIODRIVER: dummy
        run: python3 -S -B tools/test_review_history_repairs.py -v
      - name: Raw lane-word classification regressions
        env:
          SDL_AUDIODRIVER: dummy
        run: python3 -B tools/check_lane_word_classification.py
      - name: Contact checker failure-retention regressions
        env:
          SDL_AUDIODRIVER: dummy
        run: python3 -B tools/check_collapse_contact_failure_retention.py
      - name: PPM raster boundary regressions
        env:
          SDL_AUDIODRIVER: dummy
        run: python3 -B tools/check_frame_compare_ppm.py
      - name: Source ownership and guardrail regressions
        env:
          SDL_AUDIODRIVER: dummy
        run: python3 -B tools/check_source_guardrails.py
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Collapse map boundary regressions
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: ctest --test-dir build --verbose --output-on-failure -R '^(collapse_rectangle_unit|collapse_(map|removal|physical_seed)_(unit|fixture|checker|original))$'
      - name: Preserve collapse map boundary diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collapse-map-${{ runner.os }}
          path: |
            build/collapse-map-app/
            build/collapse-removal-app/
            build/physical-seed-app/
            build/Testing/Temporary/LastTest.log
          if-no-files-found: error
      - name: Generic corpse and boss sound ownership regressions
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: ctest --test-dir build --verbose --output-on-failure -R '^(monster_tile_damage_original|monster_death_sound)$'
      - name: Preserve focused corpse sound diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpse-sound-linux-focused
          path: |
            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: error
      - name: Physical spawner construction regressions
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: ctest --test-dir build --verbose --output-on-failure -R '^(spawner_construction_(fixture|storage_original)|spawner_storage)$'
      - name: Preserve focused spawner construction diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spawner-construction-linux-focused
          path: |
            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: error
      - name: Byte-addressed damage lane regressions
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: ctest --test-dir build --verbose --output-on-failure -R '^damage_lane_(bytes_(unit|checker|fixture|original)|memory_(unit|initial_data(_checker)?|original)|history_(checker|fixture|original))$'
      - name: Preserve byte-addressed damage lane diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: damage-lane-bytes-linux
          path: |
            build/damage-lane-bytes-app/
            build/damage-lane-memory-app/
            build/damage-lane-history-app/
          if-no-files-found: ignore
      - name: Complete fatal-entry physical storage regressions
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: ctest --test-dir build --verbose --output-on-failure -R '^(fatal_entry_(checker|fixture|original)|monster_object_(consume|branch)_original|monster_object_seeder_(checker|fixture|original)|retained_record_queue|seeder_capacity_(checker|fixture|original)|multicell_seeder_(checker|fixture|original)|collapse_retirement_(checker|fixture|original)|fracture_retirement_(checker|fixture|original)|fracture_capacity_(checker|fixture|original)|collapse_contact_pools_(fixture|original)|contact_staging_(checker|fixture|original)|above_contact_staging_(checker|fixture|original)|debris_contact_pools_(checker|fixture|original))$'
      - name: Preserve complete fatal-entry diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fatal-entry-linux-focused
          path: |
            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary/LastTestsFailed.log
            build/fatal-entry-app/
            build/monster-object-seeder-app/
            build/monster-seeder-input-*/fixture.bin.gz
            build/seeder-capacity-app/
            build/seeder-capacity-input-*/fixture.bin.gz
            build/multicell-seeder-app/
            build/multicell-seeder-input-*/fixture.bin.gz
            build/collapse-retirement-app/
            build/collapse-retirement-input-*/fixture.bin.gz
            build/fracture-retirement-app/
            build/fracture-retirement-input-*/fixture.bin.gz
            build/fracture-capacity-app/
            build/fracture-capacity-input-*/fixture.bin.gz
            build/collapse-contact-pools-app/
            build/collapse-contact-pools-input-*/fixture.bin.gz
            build/contact-staging-app/
            build/contact-staging-input-*/fixture.bin.gz
            build/above-contact-staging-app/
            build/above-contact-staging-input-*/fixture.bin.gz
            build/debris-contact-pools-app/
            build/debris-contact-pools-input-*/fixture.bin.gz
          if-no-files-found: error
      - name: Independent timed-writeback fixture regressions
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: ctest --test-dir build --verbose --output-on-failure -R '^(timed_seed_isolation|timed_writeback_original|timed_writeback_replay_guard)$'
      - name: Preserve timed-writeback fixture diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timed-writeback-linux-focused
          path: |
            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: error
      - name: Complete corpse physical storage regressions
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: ctest --test-dir build --verbose --output-on-failure -R '^corpse_storage_(helper_original|app_original|helper_protocol|app_protocol|tools_contract)$'
      - name: Preserve complete corpse storage diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpse-storage-linux-focused
          path: |
            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary/LastTestsFailed.log
            build/corpse-storage-checks/
          if-no-files-found: error
      - name: Complete reward physical storage regressions
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: ctest --test-dir build --verbose --output-on-failure -R '^reward_storage_(helper_original|app_original|helper_protocol|app_protocol|tools_contract)$'
      - name: Preserve complete reward storage diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reward-storage-linux-focused
          path: |
            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary/LastTestsFailed.log
            build/reward-storage-checks/
          if-no-files-found: error
      - name: Complete marker physical storage regressions
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: ctest --test-dir build --verbose --output-on-failure -R '^marker_storage_(helper_original|app_original|tools_contract)$'
      - name: Preserve complete marker storage diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marker-storage-linux-focused
          path: |
            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary/LastTestsFailed.log
            build/marker-storage-checks/
