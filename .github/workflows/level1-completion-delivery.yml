name: Validate Level 1 completion delivery
on:
  push:
    branches: [codex/level1-natural-completion]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: level1-completion-delivery
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/level1-natural-completion
          fetch-depth: 0
      - name: Verify and apply reviewed source
        run: |
          test "$(git rev-parse origin/main)" = 92a0cd3180ce3467f662c192d6d337c2a3b11365
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib, subprocess
          root = pathlib.Path('.')
          encoded = b''.join((root / f'.github/level1-completion.part{i}').read_bytes() for i in range(6))
          data = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(data).hexdigest() == 'be6ae729ad920ce6b0fa3344633f0580d2862930b73ca1e83cd47bebd4516f7e'
          patch = pathlib.Path('/tmp/level1-completion.patch')
          patch.write_bytes(data)
          subprocess.run(['git', 'apply', '--check', str(patch)], check=True)
          subprocess.run(['git', 'apply', str(patch)], check=True)
          expected = {
            'CMakeLists.txt': 'f70ccc472b1704a253a2984cd7de34df7929e5d73c405a9e8cb795c6fbbd1c83',
            'docs/recovery/level1_completion_2026-09-19.md': '3b925ad38c97885e36cb1a936d3d0bb68ef402c2e4fe3fefbba8279487309565',
            'src/app/app.cpp': '90e2b65ed8ae304439982612773f26694424ee0e021d697a975bae058da42eac',
            'tests/routes/level1_complete_1p.route': '644a9f93b4bbc2bdcb26f508cb07db0a9bbeb6bd0e1e68f71bdae3dedbb6ab77',
            'tests/routes/level1_complete_2p.route': '82881fa1797a37edfa461ff241fcf4e3683185fb8db2638a03360ae8b7ac0225',
            'tools/capture_original_level1_completion.py': '7ca4da732f5eff4fccc67ae12c0562cfac1fa03f5f5dfd3b776c565e41f98b62',
            'tools/test_level1_completion.py': 'a1400bb47014521daea35be8148206e21d92e1bea6f295b29f1fd767ecc3a493'
          }
          for name, digest in expected.items():
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == digest, name
          PY
          git diff --check
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libsdl2-dev python3 python3-pil xvfb xdotool dosbox imagemagick
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build --parallel 3
      - name: Validate natural routes and existing guards
        run: |
          mkdir artifacts
          python3 tools/test_level1_completion.py --exe build/lezac_cpp --mode single --out artifacts/single > artifacts/single.log 2>&1
          python3 tools/test_level1_completion.py --exe build/lezac_cpp --mode two --out artifacts/two > artifacts/two.log 2>&1
          SDL_VIDEODRIVER=dummy ctest --test-dir build --output-on-failure -R '^(level1_replay|level1_completion_capture_contract|autoplayer_level_transition_dummy|level_outro|port_completion_status_checker|runtime_evidence_guardrail|visual_claim_guardrail|source_guardrails_selftest)$' > artifacts/focused-tests.log 2>&1
      - name: Observe original result gate and suspension
        run: |
          mkdir /tmp/lezac-original-completion
          cp LEZAC.EXE *.DAT *.SPR *.PAL *.SCH *.SON *.MST *.CAR *.ZBG *.DOC /tmp/lezac-original-completion/
          env -u SDL_VIDEODRIVER SDL_AUDIODRIVER=dummy python3 tools/capture_original_level1_completion.py --run-dir /tmp/lezac-original-completion --out artifacts/original-completion.json --approve-procmem --approve-runtime-instrumentation > artifacts/original-completion.log 2>&1
      - name: Commit validated implementation only
        run: |
          git fetch origin main codex/level1-natural-completion
          test "$(git rev-parse origin/main)" = 92a0cd3180ce3467f662c192d6d337c2a3b11365
          test "$(git rev-parse origin/codex/level1-natural-completion)" = "$GITHUB_SHA"
          git add CMakeLists.txt src/app/app.cpp docs/recovery/level1_completion_2026-09-19.md tests/routes/level1_complete_1p.route tests/routes/level1_complete_2p.route tools/capture_original_level1_completion.py tools/test_level1_completion.py
          git rm .github/level1-completion.part? .github/workflows/level1-completion-delivery.yml
          git diff --cached --check
          git config user.name 'Lezac validation'
          git config user.email 'lezac-validation@users.noreply.github.com'
          git commit -m 'Recover collapse-gated results and natural Level 1 completion'
          git push origin HEAD:codex/level1-natural-completion
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: level1-completion-evidence
          path: artifacts
          retention-days: 7
          compression-level: 9
          if-no-files-found: warn
