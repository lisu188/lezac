name: Level 1 fidelity

on:
  push:
    branches: [codex/level1-fidelity-replay]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: level1-fidelity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Pin Level 1 validation source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare native validation headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libsdl2-dev
          tar -czf level1-sdl-headers.tar.gz -C /usr/include SDL2 x86_64-linux-gnu/SDL2
      - name: Archive exact source revision
        run: |
          git rev-parse HEAD > source-revision.txt
          git archive --format=tar.gz --output=level1-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: level1-source
          path: |
            source-revision.txt
            level1-source.tar.gz
            level1-sdl-headers.tar.gz
          retention-days: 3
          if-no-files-found: error
