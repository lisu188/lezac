name: Validate Level 1 full-frame recovery
on:
  push:
    branches: [codex/level1-natural-recovery]
    paths: [.github/workflows/level1-recovery-delivery.yml]
permissions:
  contents: write
jobs:
  validate-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/level1-natural-recovery
          fetch-depth: 0
      - name: Apply checksum-pinned source changes
        run: |
          test "$(git rev-parse origin/main)" = 92a0cd3180ce3467f662c192d6d337c2a3b11365
          python3 - <<'PY'
          import base64, hashlib, json, lzma, pathlib, subprocess
          root = pathlib.Path('.level1-delivery')
          manifest = json.loads((root / 'manifest.json').read_text())
          parts = sorted(root.glob('patch.*.b64'))
          assert [p.name for p in parts] == [f'patch.{i}.b64' for i in range(4)]
          patch = lzma.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts), validate=True))
          assert hashlib.sha256(patch).hexdigest() == manifest['patch_sha256']
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          for name, expected in manifest['files'].items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() == expected, name
          pathlib.Path('/tmp/level1-delivery-manifest.json').write_text(json.dumps(manifest))
          PY
      - name: Install native and original-game dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libsdl2-dev python3 python3-pil xvfb xdotool dosbox
      - name: Build production runtime
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build --parallel 2
      - name: Independently capture all original routes
        run: |
          for route in walk bomb objective; do
            python3 tools/level1_original.py capture --route "tests/routes/level1_original_${route}.route" --out "$RUNNER_TEMP/level1-reference-$route" --approve-procmem --approve-runtime-instrumentation
          done
      - name: Verify canonical evidence and retain raw fixtures
        run: |
          python3 - <<'PY'
          import json, os, pathlib, shutil, sys
          sys.path.insert(0, 'tools')
          import level1_original as original
          import test_level1_original as checks
          target = pathlib.Path('tests/fixtures/level1_original')
          target.mkdir(parents=True, exist_ok=False)
          pins = {}
          for name, (frames, expected) in checks.EXPECTED.items():
              source = pathlib.Path(os.environ['RUNNER_TEMP']) / f'level1-reference-{name}'
              actual = original.fingerprint(source)
              assert actual == expected, (name, actual, expected)
              header = next(original.reference_rows(source))
              assert header['settings']['ticks'] - original.PREFIX_TICKS == frames
              manifest = json.loads((source / 'manifest.json').read_text())
              shutil.copytree(source, target / name)
              (target / name / 'dosbox.log').unlink(missing_ok=True)
              pins[name] = {'canonical_sha256': actual, 'source_sha256': header['source_sha256'], 'files': manifest['files']}
              print(name, frames, actual)
          (target / 'pins.json').write_bytes(original.json_bytes(pins))
          PY
      - name: Validate production parity and guardrails
        env:
          SDL_VIDEODRIVER: dummy
        run: |
          set -o pipefail
          ctest --test-dir build -R '^(hud_models|level1_original_.*|level1_replay|source_guardrails_selftest|port_completion_status.*|runtime_evidence_guardrail.*|visual_claim_guardrail.*|autoplayer_death_reentry_dummy|autoplayer_death_visuals_dummy|autoplayer_two_player_death_visuals_dummy|two_player_hud_panel)$' --output-on-failure --timeout 240 | tee "$RUNNER_TEMP/level1-validation.log"
          git diff --check
      - name: Commit validated source and independent evidence only
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, shutil, subprocess
          manifest = json.loads(pathlib.Path('/tmp/level1-delivery-manifest.json').read_text())
          for name, expected in manifest['files'].items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() == expected, name
          subprocess.run(['git', 'add', '--', *manifest['files'], 'tests/fixtures/level1_original'], check=True)
          subprocess.run(['git', 'rm', '-r', '--', '.level1-delivery', '.github/workflows/level1-oracle-bootstrap.yml', '.github/workflows/level1-recovery-delivery.yml'], check=True)
          staged = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          allowed = set(manifest['files']) | {'.github/workflows/level1-oracle-bootstrap.yml', '.github/workflows/level1-recovery-delivery.yml'}
          assert all(p in allowed or p.startswith('tests/fixtures/level1_original/') or p.startswith('.level1-delivery/') for p in staged), staged
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          PY
          git config user.name lisu188
          git config user.email 7967861+lisu188@users.noreply.github.com
          git fetch origin main codex/level1-natural-recovery
          test "$(git rev-parse origin/main)" = 92a0cd3180ce3467f662c192d6d337c2a3b11365
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/codex/level1-natural-recovery)"
          git commit -m 'Recover original Level 1 full-frame rendering and HUD progression'
          git push origin HEAD:codex/level1-natural-recovery
          git archive --format=tar.gz --output="$RUNNER_TEMP/level1-recovery-source.tar.gz" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/level1-revision.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: level1-recovery-validation
          path: |
            ${{ runner.temp }}/level1-validation.log
            ${{ runner.temp }}/level1-recovery-source.tar.gz
            ${{ runner.temp }}/level1-revision.txt
            ${{ runner.temp }}/level1-reference-*/manifest.json
            ${{ runner.temp }}/level1-reference-*/dosbox.log
          retention-days: 7
          if-no-files-found: warn
