name: Original monster coordinate words

on:
  pull_request:
    paths:
      - tools/capture_original_monster_word_wrap.py
      - tools/capture_original_monster_writeback.py
      - tools/capture_original_flyer_contacts.py
      - tools/check_monster_writeback_fixture.py
      - tools/check_monster_word_wrap_fixture.py
      - tests/fixtures/monster_coordinate_word_wrap_original.bin
      - .github/workflows/monster-word-wrap-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original:
    name: Original monster signed-coordinate boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SDL_AUDIODRIVER: dummy
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - uses: actions/checkout@v4
      - name: Install original capture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pil xvfb xdotool dosbox
      - name: Check original coordinate instructions and fixture
        run: |
          python3 -B tools/capture_original_monster_word_wrap.py --self-check
          python3 -B tools/check_monster_word_wrap_fixture.py
      - name: Stage private original assets
        run: |
          python3 -B - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import shutil
          import sys
          sys.path.insert(0, 'tools')
          import capture_original_behavior4_targets as support
          memory = {key: int(value.split()[0]) * 1024
                    for line in Path('/proc/meminfo').read_text().splitlines()
                    for key, value in [line.split(':', 1)]}
          usage = shutil.disk_usage(os.environ['RUNNER_TEMP'])
          assert usage.free - 128 * 1024 * 1024 > usage.total // 10
          assert memory['MemAvailable'] - 512 * 1024 * 1024 > memory['MemTotal'] // 10
          run = Path(os.environ['RUNNER_TEMP']) / 'monster-word-wrap-original'
          run.mkdir()
          for name in support.ASSETS:
              source, target = Path(name), run / name
              shutil.copyfile(source, target)
              assert hashlib.sha256(source.read_bytes()).digest() == hashlib.sha256(target.read_bytes()).digest()
          PY
      - name: Observe original signed-coordinate writebacks
        run: |
          python3 -B tools/capture_original_monster_word_wrap.py \
            --run-dir "$RUNNER_TEMP/monster-word-wrap-original" \
            --out-dir "$RUNNER_TEMP/monster-word-wrap-capture" \
            --approve-procmem --approve-runtime-instrumentation
      - name: Compare raw native coordinates with the pinned fixture
        run: |
          python3 -B tools/check_monster_word_wrap_fixture.py \
            --capture "$RUNNER_TEMP/monster-word-wrap-capture"
      - name: Preserve native capture and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monster-word-wrap-original
          path: |
            ${{ runner.temp }}/monster-word-wrap-capture/
            ${{ runner.temp }}/monster-word-wrap-original/
          if-no-files-found: error
