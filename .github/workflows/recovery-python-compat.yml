name: Recovery Python compatibility

on:
  pull_request:
    paths:
      - '.github/workflows/recovery-python-compat.yml'
      - 'tools/**'
      - 'tests/gameplay/collapse*history*'
      - 'docs/recovery/evidence/boss_extended_combat_20261001/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/recovery-python-compat.yml'
      - 'tools/**'
      - 'tests/gameplay/collapse*history*'
      - 'docs/recovery/evidence/boss_extended_combat_20261001/**'

permissions:
  contents: read

jobs:
  compatibility:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.15']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SDL_AUDIODRIVER: dummy
      SDL_VIDEODRIVER: dummy
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Frozen AST and bounded diagnostic regressions
        run: python -S -B tools/test_recovery_python315.py -v
      - name: Frozen debris compression regressions
        run: python -S -B tools/test_original_debris_phase.py -v
      - name: Original bridge-access evidence regressions
        run: python -S -B tools/test_natural_level4_bridge_access.py -v
      - name: Level 4 bridge escape original fixture and guards
        run: python -S -B tools/test_natural_level4_bridge_escape.py -v
      - name: Wrapped collapse magnitude original fixture
        run: python -S -B tools/test_collapse_magnitude_wrap.py -v
      - name: Original Level 4 left return and lossless retention
        run: python -S -B tools/test_natural_level4_left_return.py -v
      - name: Original Level 4 cavity bomb and complete private readback
        run: python -S -B tools/test_natural_level4_cavity_bomb.py -v
      - name: Literal map buffer transport controls
        run: python -S -B tools/test_literal_map_buffers.py -v
      - name: Literal map observation and private readback controls
        run: python -S -B tools/test_literal_map_observer.py -v
      - name: Declared live flame state projection controls
        run: python -S -B tools/test_flame_state_projection.py -v
