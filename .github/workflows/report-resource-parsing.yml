name: Report resource parsing helpers

on:
  push:
    branches:
      - refactor/resource-parsing

permissions:
  contents: write

jobs:
  report:
    if: github.event.head_commit.message != 'Capture resource parsing helper report'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/resource-parsing
          fetch-depth: 0
      - name: Capture helper definitions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/app/app.cpp')
          text = path.read_text()
          names = [
              'readFile',
              'readTextFile',
              'parseHexByteList',
              'parseHexWordList',
              'extractStringArray',
              'extractObjectArray',
              'extractInt',
              'extractString',
          ]

          def definition(name):
              marker = name + '('
              pos = text.find(marker)
              if pos < 0:
                  raise SystemExit(f'missing {name}')
              line_start = text.rfind('\n', 0, pos) + 1
              brace = text.find('{', pos)
              if brace < 0:
                  raise SystemExit(f'missing body for {name}')
              depth = 0
              i = brace
              in_string = False
              escape = False
              while i < len(text):
                  ch = text[i]
                  if in_string:
                      if escape:
                          escape = False
                      elif ch == '\\':
                          escape = True
                      elif ch == '"':
                          in_string = False
                  else:
                      if ch == '"':
                          in_string = True
                      elif ch == '{':
                          depth += 1
                      elif ch == '}':
                          depth -= 1
                          if depth == 0:
                              end = i + 1
                              while end < len(text) and text[end] in ' \t':
                                  end += 1
                              if end < len(text) and text[end] == '\n':
                                  end += 1
                              return text[line_start:end]
                  i += 1
              raise SystemExit(f'unterminated body for {name}')

          out = []
          for name in names:
              block = definition(name)
              out.append(f'===== {name} occurrences={text.count(name + "(")} =====\n{block}')
          Path('resource_helper_report.txt').write_text('\n'.join(out))
          PY
          rm .github/workflows/report-resource-parsing.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Capture resource parsing helper report"
          git push origin HEAD:refactor/resource-parsing
