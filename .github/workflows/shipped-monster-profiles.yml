name: Original shipped monster profiles

on:
  pull_request:
    paths:
      - tools/capture_original_shipped_monster_profiles.py
      - tools/check_shipped_monster_profile_fixture.py
      - tools/capture_original_behavior4_targets.py
      - tools/capture_original_death_transients.py
      - tests/fixtures/shipped_monster_profiles_original.bin
      - .github/workflows/shipped-monster-profiles.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original:
    name: Original shipped-profile constructors and trajectories
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SDL_AUDIODRIVER: dummy
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - uses: actions/checkout@v4
      - name: Install original capture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pil xvfb xdotool dosbox
      - name: Check original windows and fixture
        run: |
          python3 -B tools/capture_original_shipped_monster_profiles.py --self-check
          python3 -B tools/check_shipped_monster_profile_fixture.py
      - name: Stage private original assets
        run: |
          python3 -B - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import shutil
          import sys
          sys.path.insert(0, 'tools')
          import capture_original_behavior4_targets as support
          usage = shutil.disk_usage(os.environ['RUNNER_TEMP'])
          assert usage.free - 256 * 1024 * 1024 > usage.total // 10
          memory = {key: int(value.split()[0]) * 1024
                    for line in Path('/proc/meminfo').read_text().splitlines()
                    for key, value in [line.split(':', 1)]}
          assert memory['MemAvailable'] - 512 * 1024 * 1024 > memory['MemTotal'] // 10
          run = Path(os.environ['RUNNER_TEMP']) / 'shipped-profile-assets'
          run.mkdir()
          for name in support.ASSETS:
              source, target = Path(name), run / name
              shutil.copyfile(source, target)
              assert hashlib.sha256(source.read_bytes()).digest() == hashlib.sha256(target.read_bytes()).digest()
          PY
      - name: Observe original constructors and continuous updates
        run: |
          python3 -B tools/capture_original_shipped_monster_profiles.py \
            --run-dir "$RUNNER_TEMP/shipped-profile-assets" \
            --out-dir "$RUNNER_TEMP/shipped-profile-capture" \
            --approve-procmem --approve-runtime-instrumentation
      - name: Compare complete native capture to fixture
        run: |
          python3 -B tools/check_shipped_monster_profile_fixture.py --capture "$RUNNER_TEMP/shipped-profile-capture"
      - name: Preserve native probe and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shipped-monster-profile-original
          path: |
            ${{ runner.temp }}/shipped-profile-capture/
            ${{ runner.temp }}/shipped-profile-assets/
          if-no-files-found: error
